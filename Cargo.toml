[workspace]
resolver = "2"
members = [
    "crates/branding",
    "crates/domain",
    "crates/protocol",
    "crates/auth",
    "crates/templates",
    "crates/updater",
    "crates/observability",
    "crates/test-support",
    "crates/config",
    "services/control-plane",
    "services/node-agent",
    "services/bootstrap",
]
default-members = [
    "crates/branding",
    "crates/domain",
    "crates/protocol",
    "crates/auth",
    "crates/templates",
    "crates/updater",
    "crates/observability",
    "crates/config",
    "services/control-plane",
    "services/node-agent",
    "services/bootstrap",
]

[workspace.package]
version = "0.0.1-alpha.1"
edition = "2021"
rust-version = "1.85.0"
license = "LicenseRef-UNDECIDED"
publish = false
authors = ["FPS contributors"]

[workspace.dependencies]
fps-branding = { path = "crates/branding" }
fps-domain = { path = "crates/domain" }
fps-protocol = { path = "crates/protocol" }
fps-auth = { path = "crates/auth" }
fps-templates = { path = "crates/templates" }
fps-updater = { path = "crates/updater" }
fps-observability = { path = "crates/observability" }
fps-test-support = { path = "crates/test-support" }
fps-config = { path = "crates/config" }

anyhow = "1.0.99"
argon2 = "0.5.3"
async-trait = "0.1.89"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio", "query", "original-uri", "matched-path", "form", "ws"] }
axum-extra = { version = "0.12.5", features = ["typed-header", "cookie"] }
axum-server = { version = "0.7.3", features = ["tls-rustls"] }
base64 = "0.22.1"
bollard = { version = "0.19.4", default-features = false, features = ["http", "pipe"] }
bytes = "1.10.1"
chrono = { version = "0.4.41", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4.5.45", features = ["derive", "env"] }
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
futures-util = "0.3.31"
hex = "0.4.3"
hmac = "0.12.1"
http = "1.3.1"
http-body-util = "0.1.3"
hyper = { version = "1.7.0", features = ["http1", "server"] }
jsonwebtoken = "9.3.1"
metrics = "0.24.2"
metrics-exporter-prometheus = { version = "0.17.2", default-features = false, features = ["http-listener"] }
mime = "0.3.17"
once_cell = "1.21.3"
password-hash = "0.5.0"
progenitor = "0.11.2"
rand = "0.8.5"
rcgen = { version = "0.14.3", features = ["pem", "x509-parser"] }
regex = "1.11.1"
reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls", "http2", "charset"] }
rustls = { version = "0.23.31", default-features = false, features = ["std", "tls12", "ring"] }
rustls-pemfile = "2.2.0"
semver = { version = "1.0.26", features = ["serde"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
serde_yaml = "0.9.34"
sha2 = "0.10.9"
subtle = "2.6.1"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "mysql", "migrate", "macros", "uuid", "chrono", "json"] }
hyper-util = { version = "0.1.17", features = ["tokio", "server-auto", "http1"] }
thiserror = "2.0.16"
time = "0.3.41"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "signal", "fs", "io-util", "net", "time", "sync"] }
tokio-rustls = "0.26.2"
toml = "0.9.5"
totp-rs = { version = "5.7.0", features = ["otpauth"] }
tower = { version = "0.5.2", features = ["util", "limit"] }
tower-http = { version = "0.6.6", features = ["cors", "fs", "trace", "limit", "request-id", "util", "set-header", "compression-gzip"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json", "fmt"] }
url = { version = "2.5.7", features = ["serde"] }
utoipa = { version = "5.4.0", features = ["chrono", "uuid", "preserve_order"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }
uuid = { version = "1.18.1", features = ["v7", "serde", "std"] }
wiremock = "0.6.5"
zeroize = { version = "1.8.1", features = ["derive"] }
aes-gcm = "0.10.3"
hkdf = "0.12.4"
governor = "0.10.1"
dashmap = "6.1.0"
indexmap = { version = "2.11.0", features = ["serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
