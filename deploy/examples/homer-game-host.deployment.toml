schema_version = 1
product_channel = "alpha"

# Homer-only: create the game-host VM (Docker + node agent). Never LXC.
# Replace every value before apply. Secrets are env var names only.

[game_node]
guest_kind = "vm"
vmid = 210
hostname = "fps-node-01"
cores = 4
memory_mib = 16384
disk_gib = 200
storage = "local-lvm"
bridge = "vmbr0"
vlan_tag = 10
ip_cidr = "10.10.1.20/24"
gateway = "10.10.1.1"
dns = ["10.10.1.1"]
ssh_public_key = "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIReplaceThisPublicKey comment"
os_template = "debian-12-cloudimg-amd64.qcow2"
os_template_sha256 = "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"

[game_node.proxmox]
url = "https://homer.example.test:8006"
node = "homer"
token_id = "bootstrap@pve!fps"
token_secret_env = "FPS_HOMER_TOKEN_SECRET"
